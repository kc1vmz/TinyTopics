springdoc.packages-to-scan=com.kc1vmz.tinytopics.controller.rest
springdoc.paths-to-match=/api/v1/**
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.override-with-generic-response=false
spring.main.banner-mode=off
logging.file.name=${TT_TEMP_DIR:${java.io.tmpdir}}/tinytopics.log
logging.logback.rollingpolicy.file-name-pattern=${TT_TEMP_DIR:${java.io.tmpdir}}/tinytopics.%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=100MB
logging.logback.rollingpolicy.clean-history-on-start=true
spring.datasource.url=jdbc:h2:file:${TT_DB_DIR:./data}/tinytopics;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
tt.nws.user-agent=${TT_NWS_USER_AGENT:TinyTopics/1.0.1}
server.port=${TT_READ_HTTP_PORT:${TT_HTTP_PORT:8088}}
tt.admin-http-port=${TT_ADMIN_HTTP_PORT:8089}
